<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maintenance User - Ambil Sparepart</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#172033;background:#edf4f7}
header{background:linear-gradient(135deg,#071d30,#123b50);color:#fff;text-align:center;padding:20px;border-bottom:3px solid #18b957}
header h1{margin:0;font-size:clamp(23px,5vw,38px)} header p{margin:7px 0 0;color:#cbd8e2}
main{width:min(720px,calc(100% - 24px));margin:20px auto 40px}.card{background:#fff;border-radius:20px;padding:22px;border:1px solid #d9e4e9;box-shadow:0 10px 28px #123b5018;border-left:6px solid #18ad55}
.badge{display:inline-block;padding:7px 11px;border-radius:99px;background:#e9f8ef;color:#138944;font-size:12px;font-weight:800}
.code{font-size:clamp(30px,8vw,48px);font-weight:900;margin-top:12px}.name{font-size:clamp(19px,4vw,28px);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.box{padding:14px;border:1px solid #e1eaee;border-radius:14px;background:#f7fafb}
.label{font-size:12px;font-weight:800;color:#64748b;text-transform:uppercase}.value{margin-top:5px;font-weight:800;line-height:1.45}
.stock{text-align:center;margin-top:14px;padding:17px;border-radius:15px;background:#effaf3;border:1px solid #b9e7c9}.stock.low{background:#fff8e8;border-color:#f0d38a}.stock.empty{background:#fff0f0;border-color:#efb0b0}
.num{font-size:48px;font-weight:900}.status{font-weight:800}
h2{font-size:19px;margin:22px 0 10px}label{display:block;font-size:13px;font-weight:800;margin:10px 0 6px}
input,textarea{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:12px;font-size:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.take{width:100%;margin-top:16px;min-height:52px;border:0;border-radius:14px;background:#18a953;color:#fff;font-weight:900;font-size:16px;cursor:pointer}.take:disabled{opacity:.55}
.msg{display:none;margin-top:13px;padding:12px;border-radius:10px;font-weight:700}.msg.show{display:block}.ok{background:#e9f8ef;color:#137c3d}.err{background:#fff0f0;color:#b42318}
.back{display:block;text-align:center;margin-top:16px;color:#168d48;font-weight:800;text-decoration:none}
@media(max-width:600px){main{width:calc(100% - 14px);margin-top:10px}.card{padding:16px;border-radius:17px}.grid,.row{grid-template-columns:1fr}}
</style></head><body>
<header><h1>MAINTENANCE • USER</h1><p>Sparepart Inventory • Ambil Barang</p></header>
<main><section class="card" id="card"><div style="text-align:center;padding:35px;color:#64748b">Membaca data sparepart...</div></section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import{getFirestore,doc,getDoc,runTransaction,collection,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyB4ea4a-Q2wNWagzatBWx6DuEgmyLKTjOs",authDomain:"stock-sparepart-a66cf.firebaseapp.com",projectId:"stock-sparepart-a66cf",storageBucket:"stock-sparepart-a66cf.firebasestorage.app",messagingSenderId:"1064348530987",appId:"1:1064348530987:web:299b60f0db04e5a904ed6e"});
const db=getFirestore(app),tr=collection(db,"transactions"),card=document.getElementById("card");
 let currentMinStock=0;
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
const key=v=>encodeURIComponent(String(v).trim()),code=new URLSearchParams(location.search).get("code")?.trim();
function status(q,m){return q<=0?["HABIS","empty"]:q<=m?["LOW","low"]:["OK",""]}
async function load(){
 try{
  if(!code)throw Error("QR tidak memiliki kode sparepart.");
  const s=await getDoc(doc(db,"spareparts",key(code))); if(!s.exists())throw Error("Sparepart "+code+" tidak ditemukan.");
  const d=s.data(),q=Number(d.qty||0),m=Number(d.minqty||0),st=status(q,m);
   currentMinStock=m;
  card.innerHTML=`<span class="badge">USER WEB • BARANG KELUAR</span><div class="code">${esc(d.code||code)}</div><div class="name">${esc(d.name||"-")}</div>
  <div class="grid"><div class="box"><div class="label">Lokasi</div><div class="value">${esc(d.lokasi||"-")}</div></div><div class="box"><div class="label">Minimum Stock</div><div class="value">${m}</div></div></div>
  <div class="stock ${st[1]}"><div class="label">STOCK TERSEDIA</div><div class="num" id="stock">${q}</div><div class="status">${st[0]}</div></div>
  <h2>Ambil Barang</h2><div class="row"><div><label>Jumlah diambil</label><input id="qty" type="number" min="1" max="${Math.max(q,1)}" value="1"></div><div><label>Nama Operator</label><input id="op" placeholder="Nama operator"></div></div>
  <label>Keterangan</label><textarea id="note" rows="2" placeholder="Opsional"></textarea>
  <button class="take" id="take" ${q<=0?"disabled":""}>AMBIL BARANG (KELUAR)</button><div class="msg" id="msg"></div>
  <a class="back" href="./index.html">Kembali ke Web Maintenance</a>`;
  document.getElementById("take").onclick=take;
 }catch(e){card.innerHTML=`<div class="msg show err">${esc(e.message)}</div>`}
}
function msg(t,c){const e=document.getElementById("msg");e.textContent=t;e.className="msg show "+c}
async function take(){
 const b=document.getElementById("take"),n=Math.floor(Number(document.getElementById("qty").value||0)),op=document.getElementById("op").value.trim(),note=document.getElementById("note").value.trim();
 if(n<1)return msg("Jumlah harus lebih dari 0.","err");if(!op)return msg("Nama operator wajib diisi.","err");
 b.disabled=true;b.textContent="MEMPROSES...";
 try{
  const ref=doc(db,"spareparts",key(code));let rem=0;
  await runTransaction(db,async tx=>{const s=await tx.get(ref);if(!s.exists())throw Error("Sparepart tidak ditemukan.");const q=Number(s.data().qty||0);if(n>q)throw Error("Stock tidak mencukupi. Stock saat ini: "+q);rem=q-n;tx.update(ref,{qty:rem,updatedAt:serverTimestamp()})});
  await addDoc(tr,{code,type:"out",qty:n,operator:op,note,remainingStock:rem,createdAt:serverTimestamp()});
  document.getElementById("stock").textContent=rem;
   const st=status(rem,currentMinStock);
   const stockEl=document.querySelector(".stock");
   if(stockEl){stockEl.className="stock "+st[1];}
   const statusEl=document.querySelector(".stock .status");
   if(statusEl)statusEl.textContent=st[0];
   const takeBtn=document.getElementById("take");
   if(rem<=0)takeBtn.disabled=true;
   msg("Barang berhasil diambil. Stock tersisa: "+rem,"ok");
 }catch(e){msg("Gagal mengambil barang: "+e.message,"err");b.disabled=false;b.textContent="AMBIL BARANG (KELUAR)"}
}
load();
</script></body></html>
