<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stock Sparepart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 8px 0 0;
            color: #d1d5db;
        }

        .container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .search-box {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        .table-box {
            background: white;
            border-radius: 10px;
            overflow-x: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th {
            background: #374151;
            color: white;
            padding: 13px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f9fafb;
        }

        .ok {
            color: #15803d;
            font-weight: bold;
        }

        .ng {
            color: #dc2626;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin: 30px 0;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h1>STOCK SPAREPART</h1>
    <p>Database Sparepart & Inventory</p>
</header>

<div class="container">

    <div class="search-box">
        <input
            type="text"
            id="search"
            placeholder="🔍 Cari kode atau nama sparepart..."
        >
    </div>

    <div class="table-box">

        <table>

            <thead>
                <tr>
                    <th>Kode</th>
                    <th>Nama Sparepart</th>
                    <th>Lokasi</th>
                    <th>Stock</th>
                    <th>Min. Stock</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="stockTable">

                <tr>
                    <td>BRG001</td>
                    <td>Arduino</td>
                    <td>Rak 1</td>
                    <td>3</td>
                    <td>0</td>
                    <td class="ok">OK</td>
                </tr>

            </tbody>

        </table>

    </div>

</div>

<div class="footer">
    Created by : Nugroho Kunto Aji
</div>

<script>

const search = document.getElementById("search");

search.addEventListener("input", function() {

    const keyword = this.value.toLowerCase();

    const rows = document.querySelectorAll("#stockTable tr");

    rows.forEach(row => {

        const text = row.innerText.toLowerCase();

        if (text.includes(keyword)) {
            row.style.display = "";
        } else {
            row.style.display = "none";
        }

    });

});

</script>

</body>
</html>
