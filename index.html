<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Stock Sparepart</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

html{
    font-family:Arial,Helvetica,sans-serif;
}

body{
    margin:0;
    background:#f4f6f8;
    color:#222;
}

/* =========================================================
   LOGIN
========================================================= */

#loginScreen{
    position:fixed;
    inset:0;
    z-index:99999;

    background:#1f2937;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.login-box{
    width:min(420px,100%);

    background:white;

    border-radius:18px;

    padding:30px;

    text-align:center;

    box-shadow:0 10px 40px rgba(0,0,0,.3);
}

.login-box h2{
    margin:0 0 8px;

    color:#1f2937;

    font-size:28px;
}

.login-box p{
    margin:0 0 25px;

    color:#64748b;

    font-size:16px;
}

.login-box input{
    width:100%;

    padding:15px;

    border:1px solid #cbd5e1;

    border-radius:10px;

    font-size:18px;

    outline:none;

    text-align:center;
}

.login-box input:focus{
    border-color:#2563eb;
}

.login-button{
    width:100%;

    margin-top:15px;

    padding:14px;

    border:0;

    border-radius:10px;

    background:#2563eb;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;
}

.login-button:active{
    transform:scale(.98);
}

.login-error{
    min-height:22px;

    margin-top:12px;

    color:#dc2626;

    font-weight:bold;
}

/* =========================================================
   HEADER
========================================================= */

header{
    background:#1f2937;
    color:white;

    padding:30px 70px;

    text-align:center;
}

header h1{
    margin:0;
    font-size:34px;
}

header p{
    margin:8px 0 0;

    color:#d1d5db;

    font-size:19px;
}

/* =========================================================
   MENU
========================================================= */

.menu-button{
    position:fixed;

    top:16px;
    right:16px;

    z-index:1001;

    padding:13px 18px;

    border:0;
    border-radius:12px;

    background:white;

    color:#111827;

    font-size:16px;

    font-weight:bold;

    box-shadow:0 4px 15px rgba(0,0,0,.2);

    cursor:pointer;
}

.drawer{
    position:fixed;

    top:0;
    right:-380px;

    width:350px;
    max-width:90%;

    height:100vh;

    background:white;

    z-index:1000;

    padding:25px 20px;

    box-shadow:-8px 0 25px rgba(0,0,0,.2);

    transition:.25s;

    overflow:auto;
}

.drawer.open{
    right:0;
}

.drawer h2{
    margin-top:0;

    color:#1f2937;
}

.menu-item{
    display:block;

    width:100%;

    padding:17px 10px;

    border:0;

    border-bottom:1px solid #e5e7eb;

    background:white;

    text-align:left;

    font-size:17px;

    color:#111827;

    cursor:pointer;
}

.menu-item:hover{
    background:#f3f4f6;
}

.overlay{
    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.45);

    z-index:999;
}

.overlay.show{
    display:block;
}

/* =========================================================
   CONTAINER
========================================================= */

.container{
    width:94%;

    max-width:1400px;

    margin:25px auto 50px;
}

/* =========================================================
   SEARCH
========================================================= */

.search-box{
    background:white;

    padding:18px;

    border-radius:16px;

    margin-bottom:20px;

    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.search-box input{
    width:100%;

    padding:16px;

    border:1px solid #cbd5e1;

    border-radius:10px;

    font-size:18px;

    outline:none;
}

.search-box input:focus{
    border-color:#2563eb;
}

/* =========================================================
   DASHBOARD
========================================================= */

.stats{
    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:15px;

    margin-bottom:20px;
}

.stat{
    background:white;

    padding:20px;

    border-radius:15px;

    box-shadow:0 4px 15px rgba(0,0,0,.06);

    transition:.2s;
}

.stat.clickable{
    cursor:pointer;
}

.stat.clickable:hover{
    transform:translateY(-2px);

    box-shadow:
        0 7px 20px rgba(0,0,0,.12);
}

.stat.clickable:active{
    transform:scale(.98);
}

.stat-title{
    color:#64748b;

    font-size:17px;
}

.stat-value{
    margin-top:7px;

    font-size:34px;

    font-weight:bold;
}

.stat-hint{
    margin-top:8px;

    font-size:13px;

    color:#94a3b8;
}

.stat-low{
    border-left:5px solid #d97706;
}

.stat-empty{
    border-left:5px solid #dc2626;
}

.stat-restock{
    border-left:5px solid #f59e0b;
}

/* =========================================================
   TABLE
========================================================= */

.table-wrap{
    background:white;

    border-radius:16px;

    overflow:auto;

    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

table{
    width:100%;

    border-collapse:collapse;

    min-width:1000px;
}

th{
    background:#374151;

    color:white;

    padding:15px;

    text-align:left;
}

td{
    padding:14px;

    border-bottom:1px solid #e5e7eb;
}

.status-ok{
    color:#15803d;

    font-weight:bold;
}

.status-low{
    color:#d97706;

    font-weight:bold;
}

.status-empty{
    color:#dc2626;

    font-weight:bold;
}

/* =========================================================
   BUTTON
========================================================= */

button{
    cursor:pointer;
}

.actions{
    display:flex;

    flex-wrap:wrap;

    gap:6px;
}

.btn{
    border:0;

    border-radius:8px;

    padding:9px 12px;

    font-weight:bold;

    color:white;
}

.btn-in{
    background:#15803d;
}

.btn-out{
    background:#dc2626;
}

.btn-edit{
    background:#475569;
}

.btn-delete{
    background:#991b1b;
}

.btn-primary{
    background:#2563eb;

    color:white;

    border:0;

    border-radius:8px;

    padding:12px 16px;

    font-weight:bold;
}

.btn-success{
    background:#15803d;

    color:white;

    border:0;

    border-radius:8px;

    padding:12px 16px;

    font-weight:bold;
}

.btn-light{
    background:#e5e7eb;

    color:#111827;

    border:0;

    border-radius:8px;

    padding:12px 16px;

    font-weight:bold;
}

/* =========================================================
   MODAL
========================================================= */

.modal{
    display:none;

    position:fixed;

    inset:0;

    z-index:1100;

    background:rgba(0,0,0,.5);

    align-items:center;

    justify-content:center;

    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-card{
    width:min(900px,100%);

    max-height:92vh;

    overflow:auto;

    background:white;

    border-radius:16px;

    padding:22px;
}

.modal-card.small{
    width:min(550px,100%);
}

.modal-card h2{
    margin-top:0;

    color:#1f2937;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;

    margin-bottom:6px;

    font-weight:bold;
}

.form-group input,
.form-group select{
    width:100%;

    padding:12px;

    border:1px solid #cbd5e1;

    border-radius:8px;

    font-size:16px;

    outline:none;
}

.form-group input:focus,
.form-group select:focus{
    border-color:#2563eb;
}

.modal-actions{
    display:flex;

    gap:10px;

    justify-content:flex-end;

    margin-top:18px;
}

/* =========================================================
   STOCK LIST
========================================================= */

.stock-list{
    display:flex;

    flex-direction:column;

    gap:10px;

    margin-top:15px;
}

.stock-item{
    border:1px solid #e2e8f0;

    border-radius:12px;

    padding:15px;

    background:#f8fafc;
}

.stock-item-header{
    display:flex;

    justify-content:space-between;

    gap:10px;

    align-items:center;
}

.stock-code{
    font-weight:bold;

    font-size:17px;
}

.stock-name{
    color:#475569;

    margin-top:5px;
}

.stock-info{
    display:flex;

    flex-wrap:wrap;

    gap:10px;

    margin-top:10px;
}

.stock-badge{
    padding:6px 10px;

    border-radius:7px;

    font-size:13px;

    font-weight:bold;

    background:#e2e8f0;

    color:#334155;
}

.badge-low{
    background:#fef3c7;

    color:#92400e;
}

.badge-empty{
    background:#fee2e2;

    color:#991b1b;
}

/* =========================================================
   IMPORT EXCEL
========================================================= */

.import-info{
    background:#f8fafc;

    border:1px solid #e2e8f0;

    border-radius:10px;

    padding:14px;

    margin-bottom:15px;

    line-height:1.6;
}

.excel-preview{
    overflow:auto;

    max-height:400px;

    margin-top:15px;
}

.excel-preview table{
    min-width:700px;
}

/* =========================================================
   MESSAGE
========================================================= */

.message{
    position:fixed;

    left:50%;

    bottom:20px;

    transform:translateX(-50%);

    z-index:2000;

    padding:13px 20px;

    border-radius:9px;

    color:white;

    display:none;

    max-width:90%;

    text-align:center;

    font-size:16px;
}

.message.show{
    display:block;
}

.message.ok{
    background:#15803d;
}

.message.error{
    background:#b91c1c;
}

/* =========================================================
   FOOTER
========================================================= */

footer{
    text-align:center;

    color:#6b7280;

    padding:25px;

    font-size:16px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:1000px){

    .stats{
        grid-template-columns:
            repeat(2,1fr);
    }

}

@media(max-width:700px){

    header{
        padding:
            35px
            70px
            28px
            20px;
    }

    header h1{
        font-size:28px;
    }

    header p{
        font-size:16px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .drawer{
        width:320px;
    }

    .container{
        width:94%;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     LOGIN
========================================================= -->

<div id="loginScreen">

    <div class="login-box">

        <h2>
            INVENTORY DATABASE
        </h2>

        <p>
            Masukkan password untuk melanjutkan
        </p>

        <input
            id="loginPassword"
            type="password"
            placeholder="Password"
            autocomplete="off">

        <button
            class="login-button"
            id="loginButton">

            MASUK

        </button>

        <div
            class="login-error"
            id="loginError">
        </div>

    </div>

</div>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

    <h1>
        STOCK SPAREPART
    </h1>

    <p>
        Database Sparepart &amp; Inventory
    </p>

</header>


<!-- =========================================================
     MENU
========================================================= -->

<button
    class="menu-button"
    id="menuButton">

    MENU

</button>


<div
    class="overlay"
    id="overlay">
</div>


<aside
    class="drawer"
    id="drawer">

    <h2>
        MENU
    </h2>


    <button
        class="menu-item"
        data-menu="data">

        Data Sparepart

    </button>


    <button
        class="menu-item"
        data-menu="add">

        Tambah Sparepart

    </button>


    <button
        class="menu-item"
        data-menu="import">

        Import Excel

    </button>


    <button
        class="menu-item"
        data-menu="export">

        Export Excel

    </button>


    <button
        class="menu-item"
        data-menu="in">

        Barang Masuk

    </button>


    <button
        class="menu-item"
        data-menu="out">

        Barang Keluar

    </button>


    <button
        class="menu-item"
        data-menu="history">

        History Transaksi

    </button>

</aside>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="container">


<section class="search-box">

    <input
        id="search"
        type="search"
        placeholder="Cari kode, nama atau lokasi sparepart...">

</section>


<!-- =========================================================
     DASHBOARD
========================================================= -->

<section class="stats">


<div class="stat">

    <div class="stat-title">
        Total Sparepart
    </div>

    <div
        class="stat-value"
        id="totalItems">

        0

    </div>

</div>


<div class="stat">

    <div class="stat-title">
        Status OK
    </div>

    <div
        class="stat-value"
        id="
