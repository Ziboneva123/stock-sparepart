<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Inventory Database</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body{

    background:#1f2937;

}


/* =====================================================
   LOGIN PAGE
===================================================== */

.login-page{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:25px;

}


/* =====================================================
   LOGIN CARD
===================================================== */

.login-card{

    width:100%;

    max-width:630px;

    background:white;

    border-radius:28px;

    padding:48px 48px 42px;

    text-align:center;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.25);

}


/* =====================================================
   TITLE
===================================================== */

.login-title{

    margin:0;

    color:#1f2937;

    font-size:42px;

    font-weight:bold;

    letter-spacing:.5px;

}


.login-subtitle{

    margin-top:18px;

    margin-bottom:40px;

    color:#64748b;

    font-size:23px;

}


/* =====================================================
   PASSWORD
===================================================== */

.password-wrapper{

    position:relative;

    width:100%;

}


#loginPassword{

    width:100%;

    height:70px;

    padding:
        10px
        65px
        10px
        20px;

    border:
        1px solid
        #cbd5e1;

    border-radius:14px;

    font-size:24px;

    text-align:center;

    outline:none;

}


#loginPassword:focus{

    border-color:#2563eb;

    box-shadow:
        0 0 0 3px
        rgba(37,99,235,.12);

}


/* =====================================================
   PASSWORD EYE BUTTON
===================================================== */

.toggle-password{

    position:absolute;

    right:12px;

    top:50%;

    transform:
        translateY(-50%);

    width:48px;

    height:48px;

    border:0;

    border-radius:10px;

    background:transparent;

    font-size:24px;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

}


.toggle-password:hover{

    background:#f1f5f9;

}


/* =====================================================
   LOGIN BUTTON
===================================================== */

.login-button{

    width:100%;

    height:70px;

    margin-top:24px;

    border:0;

    border-radius:14px;

    background:#2563eb;

    color:white;

    font-size:24px;

    font-weight:bold;

    cursor:pointer;

}


.login-button:hover{

    background:#1d4ed8;

}


.login-button:active{

    transform:scale(.99);

}


/* =====================================================
   ERROR
===================================================== */

.login-error{

    min-height:25px;

    margin-top:18px;

    color:#dc2626;

    font-size:17px;

    font-weight:bold;

}


/* =====================================================
   DEVELOPER INFO
===================================================== */

.developer-info{

    margin-top:25px;

    padding-top:20px;

    border-top:
        1px solid
        #e5e7eb;

    color:#64748b;

    font-size:17px;

    line-height:1.6;

}


.developer-info strong{

    color:#1f2937;

}


.developer-link{

    color:#2563eb;

    font-weight:bold;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .login-page{

        padding:20px;

    }


    .login-card{

        padding:
            40px
            25px
            35px;

        border-radius:25px;

    }


    .login-title{

        font-size:34px;

    }


    .login-subtitle{

        font-size:19px;

        margin-bottom:30px;

    }


    #loginPassword{

        height:62px;

        font-size:21px;

    }


    .login-button{

        height:62px;

        font-size:21px;

    }


    .developer-info{

        font-size:15px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div
    class="login-page"
    id="loginPage">


    <div
        class="login-card">


        <h1
            class="login-title">

            INVENTORY DATABASE

        </h1>


        <div
            class="login-subtitle">

            Masukkan password untuk melanjutkan

        </div>


        <!-- PASSWORD -->

        <div
            class="password-wrapper">


            <input
                id="loginPassword"
                type="password"
                placeholder="Password"
                autocomplete="off">


            <button
                type="button"
                id="togglePassword"
                class="toggle-password"
                aria-label="Tampilkan password">

                👁

            </button>


        </div>


        <!-- LOGIN BUTTON -->

        <button
            type="button"
            id="loginButton"
            class="login-button">

            MASUK

        </button>


        <!-- ERROR -->

        <div
            id="loginError"
            class="login-error">

        </div>


        <!-- DEVELOPER -->

        <div
            class="developer-info">

            Belum punya Password ?

            <br>

            hub Developer :

            <strong>
                Nugroho Kunto Aji
            </strong>

        </div>


    </div>

</div>


<script>

/* =====================================================
   PASSWORD
===================================================== */

const CORRECT_PASSWORD =
    "mtcgoahead";


/* =====================================================
   ELEMENT
===================================================== */

const loginPassword =
    document.getElementById(
        "loginPassword"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const loginError =
    document.getElementById(
        "loginError"
    );


const togglePassword =
    document.getElementById(
        "togglePassword"
    );


/* =====================================================
   SHOW / HIDE PASSWORD
===================================================== */

togglePassword.addEventListener(
    "click",
    function(){

        if(
            loginPassword.type ===
            "password"
        ){

            loginPassword.type =
                "text";


            togglePassword.textContent =
                "🙈";


            togglePassword.setAttribute(
                "aria-label",
                "Sembunyikan password"
            );

        }
        else{

            loginPassword.type =
                "password";


            togglePassword.textContent =
                "👁";


            togglePassword.setAttribute(
                "aria-label",
                "Tampilkan password"
            );

        }

    }
);


/* =====================================================
   LOGIN
===================================================== */

function login(){

    const password =
        loginPassword.value;


    loginError.textContent =
        "";


    if(
        password ===
        CORRECT_PASSWORD
    ){

        /*
         * Simpan status login
         * selama browser/session masih aktif.
         */

        sessionStorage.setItem(
            "inventoryLogin",
            "true"
        );


        /*
         * Masuk ke halaman inventory.
         *
         * GANTI "inventory.html"
         * jika nama file inventory
         * Anda berbeda.
         */

        window.location.href =
            "inventory.html";

    }
    else{

        loginError.textContent =
            "Password salah.";

        loginPassword.value =
            "";

        loginPassword.focus();

    }

}


/* =====================================================
   BUTTON MASUK
===================================================== */

loginButton.addEventListener(
    "click",
    login
);


/* =====================================================
   ENTER
===================================================== */

loginPassword.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            login();

        }

    }
);

</script>

</body>

</html>
