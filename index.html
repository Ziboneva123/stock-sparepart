<head>

<style>
* {
    box-sizing: border-box;
}

html {
    font-family: Arial, Helvetica, sans-serif;
}

body {
    margin: 0;
    background: #f4f6f8;
    color: #222;
}

/* =========================
   HEADER
   ========================= */

header {
    background: #1f2937;
    color: white;
    padding: 28px 20px 30px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 34px;
}

header p {
    margin: 8px 0 0;
    color: #d1d5db;
    font-size: 20px;
}

/* =========================
   MENU BUTTON
   ========================= */

.menu-button {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 1001;

    width: 50px;
    height: 50px;

    border: 0;
    border-radius: 12px;

    background: white;
    color: #111827;

    font-size: 14px;
    font-weight: bold;

    box-shadow: 0 4px 15px rgba(0,0,0,.20);

    cursor: pointer;
}

/* =========================
   MAIN
   ========================= */

.container {
    width: 94%;
    max-width: 1400px;

    margin: 28px auto 50px;
}

/* =========================
   SEARCH
   ========================= */

.search-box {
    background: white;

    padding: 20px;

    border-radius: 18px;

    box-shadow: 0 5px 20px rgba(0,0,0,.08);

    margin-bottom: 22px;
}

.search-box input {
    width: 100%;

    padding: 17px 18px;

    border: 1px solid #cbd5e1;

    border-radius: 13px;

    font-size: 19px;

    outline: none;
}

.search-box input:focus {
    border-color: #64748b;

    box-shadow:
        0 0 0 3px rgba(100,116,139,.15);
}

/* =========================
   DASHBOARD
   ========================= */

.stats {
    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 16px;

    margin-bottom: 22px;
}

.stat {
    background: white;

    border-radius: 16px;

    padding: 18px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.06);
}

.stat-title {
    color: #64748b;

    font-size: 15px;
}

.stat-value {
    font-size: 30px;

    font-weight: bold;

    margin-top: 7px;
}

/* =========================
   TABLE
   ========================= */

.table-wrap {
    background: white;

    border-radius: 18px;

    overflow: auto;

    box-shadow:
        0 5px 20px rgba(0,0,0,.08);
}

table {
    width: 100%;

    border-collapse: collapse;

    min-width: 920px;
}

th {
    background: #374151;

    color: white;

    padding: 17px 14px;

    text-align: left;

    font-size: 17px;

    white-space: nowrap;
}

td {
    padding: 15px 14px;

    border-bottom:
        1px solid #e5e7eb;

    font-size: 16px;
}

tr:last-child td {
    border-bottom: 0;
}

/* =========================
   STATUS
   ========================= */

.status-ok {
    color: #15803d;

    font-weight: bold;
}

.status-low {
    color: #d97706;

    font-weight: bold;
}

.status-empty {
    color: #dc2626;

    font-weight: bold;
}

/* =========================
   ACTION BUTTON
   ========================= */

.actions {
    display: flex;

    gap: 7px;

    flex-wrap: wrap;
}

button {
    border: 0;

    border-radius: 9px;

    padding: 10px 13px;

    cursor: pointer;

    font-size: 14px;

    font-weight: bold;
}

button:disabled {

    cursor: not-allowed;
}

.btn-in {
    background: #15803d;

}

.btn-out {
    background: #dc2626;

}

.btn-edit {

    color: white;
}

.btn-delete {
    background: #991b1b;

}

.btn-primary {
    background: #2563eb;

    color: white;
}

.btn-light {
    background: #e5e7eb;

/* =========================
   FOOTER
   ========================= */

footer {

    color: #6b7280;

    padding:
        25px

        40px;

    font-size: 17px;

/* =========================
   SIDE MENU
   ========================= */

.drawer {

    top: 0;

    right: -380px;

    width: 360px;

    max-width: 88vw;

.drawer.open {

.drawer h2 {

}

.menu-item {

    color: #1f2937;

.menu-item:hover {

}

.overlay {

    position: fixed;

    background:

    z-index: 999;
}

.overlay.show {
    display: block;
}

/* =========================
   MODAL
   ========================= */

.modal {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 1100;

    background:

.modal.show {

.modal-card {

.modal-actions {

/* =========================

.message {

    left: 50%;

}

.message.show {

}

.message.ok {

}

.message.error {

}

/* =========================
   MOBILE

@media(max-width:800px) {

        width: 94%;
    }

    }
}
</style>

<!-- =========================

<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";


import {

    getFirestore,

    collection,

    getDocs,

    getDoc,

    doc,

    setDoc,

    deleteDoc,

    updateDoc,

    addDoc,

    query,

    orderBy,

    serverTimestamp,

    runTransaction

}
from
"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
   ========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyB4ea4a-Q2wNWagzatBWx6DuEgmyLKTjOs",

    authDomain:
        "stock-sparepart-a66cf.firebaseapp.com",

    projectId:
        "stock-sparepart-a66cf",

    storageBucket:
        "stock-sparepart-a66cf.firebasestorage.app",

    messagingSenderId:
        "1064348530987",

    appId:
        "1:1064348530987:web:299b60f0db04e5a904ed6e",

    measurementId:
        "G-RNF9ZEXF6X"

};


const app =
    initializeApp(firebaseConfig);


const db =
    getFirestore(app);


const stockRef =
    collection(db, "spareparts");


let items = [];

let transactionMode =
    "in";

let editingCode =
    null;


/* =========================
   HELPER
   ========================= */

const $ = id =>
    document.getElementById(id);


function showMessage(
    text,
    type = "ok"
){

    const el =
        $("message");


    el.textContent =
        text;


    el.className =
        "message show " + type;


    setTimeout(
        () => {

            el.className =
                "message";

        },
        3000
    );

}


function escapeHtml(
    value
){

    return String(
        value ?? ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =========================
   STATUS
   ========================= */

function statusOf(
    item
){

    const qty =
        Number(
            item.qty || 0
        );


    const min =
        Number(
            item.minqty || 0
        );


    if(
        qty <= 0
    ){

        return {

            text:
                "HABIS",

            cls:
                "status-empty"

        };

    }


    if(
        qty <= min
    ){

        return {

            text:
                "LOW",

            cls:
                "status-low"

        };

    }


    return {

        text:
            "OK",

        cls:
            "status-ok"

    };

}


/* =========================
   RENDER TABLE
   ========================= */

function renderTable(){

    const keyword =
        $("search")
        .value
        .trim()
        .toLowerCase();


    const filtered =
        items.filter(
            item =>

                String(
                    item.code
                )
                .toLowerCase()
                .includes(keyword)

                ||

                String(
                    item.name
                )
                .toLowerCase()
                .includes(keyword)

                ||

                String(
                    item.lokasi
                )
                .toLowerCase()
                .includes(keyword)
        );


    $("totalItems")
        .textContent =
        items.length;


    $("okItems")
        .textContent =
        items.filter(
            x =>
                statusOf(x).text
                ===
                "OK"
        ).length;


    $("lowItems")
        .textContent =
        items.filter(
            x =>
                statusOf(x).text
                !==
                "OK"
        ).length;


    const body =
        $("stockBody");


    if(
        filtered.length === 0
    ){

        body.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="empty">

                    Data sparepart tidak ditemukan.

                </td>

            </tr>

        `;

        return;

    }


    body.innerHTML =
        filtered.map(
            item => {

                const status =
                    statusOf(item);


                return `

                    <tr>

                        <td>

                            <strong>

                                ${escapeHtml(
                                    item.code
                                )}

                            </strong>

                        </td>


                        <td>

                            ${escapeHtml(
                                item.name
                            )}

                        </td>


                        <td>

                            ${escapeHtml(
                                item.lokasi
                            )}

                        </td>


                        <td>

                            ${Number(
                                item.qty || 0
                            )}

                        </td>


                        <td>

                            ${Number(
                                item.minqty || 0
                            )}

                        </td>


                        <td
                            class="${status.cls}">

                            ${status.text}

                        </td>


                        <td>

                            <div
                                class="actions">


                                <button
                                    class="btn-in"
                                    data-in="${escapeHtml(item.code)}">

                                    Masuk

                                </button>


                                <button
                                    class="btn-out"
                                    data-out="${escapeHtml(item.code)}">

                                    Keluar

                                </button>


                                <button
                                    class="btn-edit"
                                    data-edit="${escapeHtml(item.code)}">

                                    Edit

                                </button>


                                <button
                                    class="btn-delete"
                                    data-delete="${escapeHtml(item.code)}">

                                    Hapus

                                </button>


                            </div>

                        </td>

                    </tr>

                `;

            }
        )
        .join("");


    body
        .querySelectorAll(
            "[data-in]"
        )
        .forEach(
            button => {

                button.onclick =
                    () =>
                        openTransaction(
                            "in",
                            button.dataset.in
                        );

            }
        );


    body
        .querySelectorAll(
            "[data-out]"
        )
        .forEach(
            button => {

                button.onclick =
                    () =>
                        openTransaction(
                            "out",
                            button.dataset.out
                        );

            }
        );


    body
        .querySelectorAll(
            "[data-edit]"
        )
        .forEach(
            button => {

                button.onclick =
                    () =>
                        openEdit(
                            button.dataset.edit
                        );

            }
        );


    body
        .querySelectorAll(
            "[data-delete]"
        )
        .forEach(
            button => {

                button.onclick =
                    () =>
                        deleteItem(
                            button.dataset.delete
                        );

            }
        );

}


/* =========================
   LOAD FIREBASE
   ========================= */

async function loadItems(){

    try{

        const snap =
            await getDocs(
                stockRef
            );


        items =
            snap.docs
            .map(
                d => ({

                    code:
                        d.id,

                    ...d.data()

                })
            )
            .sort(
                (a,b) =>
                    a.code.localeCompare(
                        b.code
                    )
            );


        renderTable();

        updateSelects();


    }catch(error){

        console.error(
            error
        );


        $("stockBody")
            .innerHTML = `

                <tr>

                    <td
                        colspan="7"
                        class="empty"
                        style="color:#b91c1c">

                        Gagal mengambil data Firebase:

                        <br><br>

                        ${escapeHtml(
                            error.message
                        )}

                    </td>

                </tr>

            `;

    }

}


/* =========================
   SELECT
   ========================= */

function updateSelects(){

    const options =
        items
        .map(
            item => `

                <option
                    value="${escapeHtml(item.code)}">

                    ${escapeHtml(item.code)}
                    -
                    ${escapeHtml(item.name)}

                </option>

            `
        )
        .join("");


    $("transactionCode")
        .innerHTML =
        options;


    $("historyCode")
        .innerHTML =
        options;

}


/* =========================
   MENU
   ========================= */

function openDrawer(){

    $("drawer")
        .classList
        .add("open");


    $("overlay")
        .classList
        .add("show");

}


function closeDrawer(){

    $("drawer")
        .classList
        .remove("open");


    $("overlay")
        .classList
        .remove("show");

}


$("menuButton")
    .onclick =
    openDrawer;


$("overlay")
    .onclick =
    closeDrawer;


document
    .querySelectorAll(
        ".menu-item"
    )
    .forEach(
        button => {

            button.onclick =
                () => {

                    const action =
                        button.dataset.action;


                    closeDrawer();


                    if(
                        action === "data"
                    ){

                        window.scrollTo({

                            top:0,

                            behavior:
                                "smooth"

                        });

                    }


                    if(
                        action === "add"
                    ){

                        openAdd();

                    }


                    if(
                        action === "in"
                    ){

                        openTransaction(
                            "in"
                        );

                    }


                    if(
                        action === "out"
                    ){

                        openTransaction(
                            "out"
                        );

                    }


                    if(
                        action === "history"
                    ){

                        openHistory();

                    }

                };

        }
    );


/* =========================
   SEARCH

/* =========================
   ADD
   ========================= */

function openAdd(){

    editingCode =
        null;


    $("itemModalTitle")
        .textContent =
        "Tambah Sparepart";


    $("itemCode")
        .disabled =
        false;


    $("itemCode")
        .value =
        "";


    $("itemName")
        .value =
        "";


    $("itemLocation")
        .value =
        "";


    $("itemQty")
        .value =
        0;


    $("itemMinQty")
        .value =
        0;


    $("itemOperator")
        .value =
        "";


    $("itemModal")
        .classList
        .add("show");

}


/* =========================
   EDIT
   ========================= */

function openEdit(
    code
){

    const item =
        items.find(
            x =>
                x.code === code
        );


    if(!item)
        return;


    editingCode =
        code;


    $("itemModalTitle")
        .textContent =
        "Edit Sparepart";


    $("itemCode")
        .disabled =
        true;


    $("itemCode")
        .value =
        item.code;


    $("itemName")
        .value =
        item.name || "";


    $("itemLocation")
        .value =
        item.lokasi || "";


    $("itemQty")
        .value =
        Number(
            item.qty || 0
        );


    $("itemMinQty")
        .value =
        Number(
            item.minqty || 0
        );


    $("itemOperator")
        .value =
        "";


    $("itemModal")
        .classList
        .add("show");

}


/* =========================
   SAVE ITEM
   ========================= */

$("saveItemButton")
    .onclick =
    async () => {

        const code =
            $("itemCode")
            .value
            .trim()
            .toUpperCase();


        const name =
            $("itemName")
            .value
            .trim();


        const lokasi =
            $("itemLocation")
            .value
            .trim();


        const qty =
            Number(
                $("itemQty")
                .value
            );


        const minqty =
            Number(
                $("itemMinQty")
                .value
            );


        const operator =
            $("itemOperator")
            .value
            .trim()
            ||
            "Operator";


        if(
            !code ||
            !name ||
            !lokasi
        ){

            showMessage(
                "Kode, nama dan lokasi wajib diisi.",
                "error"
            );

            return;

        }


        if(
            qty < 0 ||
            minqty < 0
        ){

            showMessage(
                "Stock tidak boleh negatif.",
                "error"
            );

            return;

        }


        try{

            const ref =
                doc(
                    db,
                    "spareparts",
                    editingCode || code
                );


            if(
                !editingCode
            ){

                const exists =
                    await getDoc(
                        ref
                    );


                if(
                    exists.exists()
                ){

                    showMessage(
                        "Kode sparepart sudah ada.",
                        "error"
                    );

                    return;

                }


                await setDoc(
                    ref,
                    {

                        name:
                            name,

                        lokasi:
                            lokasi,

                        qty:
                            qty,

                        minqty:
                            minqty,

                        updatedAt:
                            serverTimestamp()

                    }
                );


                await addDoc(

                    collection(
                        ref,
                        "history"
                    ),

                    {

                        action:
                            "tambah",

                        qty:
                            qty,

                        stockbefore:
                            0,

                        stockafter:
                            qty,

                        operator:
                            operator,

                        timestamp:
                            serverTimestamp(),

                        note:
                            "Sparepart baru"

                    }

                );


                showMessage(
                    "Sparepart berhasil ditambahkan."
                );

            }


            else{

                await updateDoc(

                    ref,

                    {

                        name:
                            name,

                        lokasi:
                            lokasi,

                        qty:
                            qty,

                        minqty:
                            minqty,

                        updatedAt:
                            serverTimestamp()

                    }

                );


                showMessage(
                    "Data sparepart berhasil diperbarui."
                );

            }


            closeModal(
                "itemModal"
            );


            await loadItems();


        }

        catch(error){

            console.error(
                error
            );


            showMessage(
                "Gagal menyimpan: "
                +
                error.message,
                "error"
            );

        }

    };


/* =========================
   DELETE
   ========================= */

async function deleteItem(
    code
){

    const item =
        items.find(
            x =>
                x.code === code
        );


    if(!item)
        return;


    const yes =
        confirm(

            "Hapus sparepart " +
            code +
            " - " +
            item.name +
            "?"

        );


    if(!yes)
        return;


    try{

        const ref =
            doc(
                db,
                "spareparts",
                code
            );


        const history =
            await getDocs(

                collection(
                    ref,
                    "history"
                )

            );


        for(
            const h of history.docs
        ){

            await deleteDoc(
                h.ref
            );

        }


        await deleteDoc(
            ref
        );


        showMessage(
            "Sparepart berhasil dihapus."
        );


        await loadItems();


    }

    catch(error){

        console.error(
            error
        );


        showMessage(
            "Gagal menghapus: "
            +
            error.message,
            "error"
        );

    }

}


/* =========================
   TRANSACTION
   ========================= */

function openTransaction(
    mode,
    selectedCode = null
){

    if(
        items.length === 0
    ){

        showMessage(
            "Belum ada sparepart.",
            "error"
        );

        return;

    }


    transactionMode =
        mode;


    $("transactionTitle")
        .textContent =

        mode === "in"

        ?

        "Barang Masuk"

        :

        "Barang Keluar";


    updateSelects();


    if(
        selectedCode
    ){

        $("transactionCode")
            .value =
            selectedCode;

    }


    $("transactionQty")
        .value =
        1;


    $("transactionOperator")
        .value =
        "";


    $("transactionNote")
        .value =
        "";


    $("transactionModal")
        .classList
        .add("show");

}


/* =========================
   SAVE TRANSACTION
   ========================= */

$("saveTransactionButton")
    .onclick =
    async () => {

        const code =
            $("transactionCode")
            .value;


        const qty =
            Number(
                $("transactionQty")
                .value
            );


        const operator =
            $("transactionOperator")
            .value
            .trim()
            ||
            "Operator";


        const note =
            $("transactionNote")
            .value
            .trim();


        if(
            !code ||
            qty <= 0
        ){

            showMessage(
                "Jumlah transaksi harus lebih dari 0.",
                "error"
            );

            return;

        }


        const ref =
            doc(
                db,
                "spareparts",
                code
            );


        try{

            await runTransaction(

                db,

                async transaction => {

                    const snap =
                        await transaction.get(
                            ref
                        );


                    if(
                        !snap.exists()
                    ){

                        throw new Error(
                            "Sparepart tidak ditemukan."
                        );

                    }


                    const data =
                        snap.data();


                    const before =
                        Number(
                            data.qty || 0
                        );


                    const after =

                        transactionMode === "in"

                        ?

                        before + qty

                        :

                        before - qty;


                    if(
                        after < 0
                    ){

                        throw new Error(

                            "Stock tidak mencukupi. " +
                            "Stock sekarang: " +
                            before

                        );

                    }


                    transaction.update(

                        ref,

                        {

                            qty:
                                after,

                            updatedAt:
                                serverTimestamp()

                        }

                    );


                    const historyRef =
                        doc(
                            collection(
                                ref,
                                "history"
                            )
                        );


                    transaction.set(

                        historyRef,

                        {

                            action:

                                transactionMode
                                === "in"

                                ?

                                "masuk"

                                :

                                "keluar",


                            qty:
                                qty,


                            stockbefore:
                                before,


                            stockafter:
                                after,


                            operator:
                                operator,


                            note:
                                note,


                            timestamp:
                                serverTimestamp()

                        }

                    );

                }

            );


            closeModal(
                "transactionModal"
            );


            showMessage(

                transactionMode === "in"

                ?

                "Barang masuk berhasil disimpan."

                :

                "Barang keluar berhasil disimpan."

            );


            await loadItems();


        }

        catch(error){

            console.error(
                error
            );


            showMessage(

                "Transaksi gagal: "
                +
                error.message,

                "error"

            );

        }

    };


/* =========================
   HISTORY
   ========================= */

async function openHistory(){

    if(
        items.length === 0
    ){

        showMessage(
            "Belum ada sparepart.",
            "error"
        );

        return;

    }


    updateSelects();


    $("historyContent")
        .innerHTML =
        "Memuat history...";


    $("historyModal")
        .classList
        .add("show");


    await loadHistory(
        $("historyCode")
        .value
    );

}


$("historyCode")
    .onchange =
    () =>
        loadHistory(
            $("historyCode")
            .value
        );


async function loadHistory(
    code
){

    if(
        !code
    )
        return;


    try{

        const ref =
            collection(
                db,
                "spareparts",
                code,
                "history"
            );


        const q =
            query(
                ref,
                orderBy(
                    "timestamp",
                    "desc"
                )
            );


        const snap =
            await getDocs(
                q
            );


        if(
            snap.empty
        ){

            $("historyContent")
                .innerHTML =
                "<p>Belum ada transaksi.</p>";

            return;

        }


        $("historyContent")
            .innerHTML = `

                <div
                    class="table-wrap">

                    <table
                        style="min-width:700px">

                        <thead>

                            <tr>

                                <th>
                                    Waktu
                                </th>

                                <th>
                                    Aksi
                                </th>

                                <th>
                                    Qty
                                </th>

                                <th>
                                    Sebelum
                                </th>

                                <th>
                                    Sesudah
                                </th>

                                <th>
                                    Operator
                                </th>

                                <th>
                                    Keterangan
                                </th>

                            </tr>

                        </thead>


                        <tbody>

                            ${

                                snap.docs
                                .map(
                                    d => {

                                        const x =
                                            d.data();


                                        const date =

                                            x.timestamp?.toDate

                                            ?

                                            x.timestamp
                                            .toDate()
                                            .toLocaleString(
                                                "id-ID"
                                            )

                                            :

                                            "-";


                                        return `

                                            <tr>

                                                <td>
                                                    ${escapeHtml(date)}
                                                </td>

                                                <td>
                                                    ${escapeHtml(
                                                        x.action
                                                    )}
                                                </td>

                                                <td>
                                                    ${Number(
                                                        x.qty || 0
                                                    )}
                                                </td>

                                                <td>
                                                    ${Number(
                                                        x.stockbefore || 0
                                                    )}
                                                </td>

                                                <td>
                                                    ${Number(
                                                        x.stockafter || 0
                                                    )}
                                                </td>

                                                <td>
                                                    ${escapeHtml(
                                                        x.operator || "-"
                                                    )}
                                                </td>

                                                <td>
                                                    ${escapeHtml(
                                                        x.note || "-"
                                                    )}
                                                </td>

                                            </tr>

                                        `;

                                    }
                                )
                                .join("")

                            }

                        </tbody>

                    </table>

                </div>

            `;

    }

    catch(error){

        console.error(
            error
        );


        $("historyContent")
            .innerHTML =

            '<p style="color:#b91c1c">' +

            "Gagal mengambil history: " +

            escapeHtml(
                error.message
            ) +

            "</p>";

    }

}


/* =========================
   CLOSE MODAL
   ========================= */

window.closeModal =
function(id){

    $(id)
        .classList
        .remove("show");

};


document
    .querySelectorAll(
        ".modal"
    )
    .forEach(
        modal => {

            modal.addEventListener(

                "click",

                event => {

                    if(
                        event.target ===
                        modal
                    ){

                        modal.classList
                            .remove(
                                "show"
                            );

                    }

                }

            );

        }
    );


/* =========================
   START
   ========================= */

loadItems();

</script>
