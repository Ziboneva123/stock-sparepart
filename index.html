<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Maintenance Sparepart &amp; Inventory</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

html{
    font-family:Arial,Helvetica,sans-serif;
}

body{
    margin:0;
    background:#f4f6f8;
    color:#222;
}

/* =====================================================
   LOGIN
===================================================== */

#loginScreen{
    position:fixed;
    inset:0;
    z-index:99999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#1f2937;
}

.login-card{
    width:100%;
    max-width:630px;
    background:white;
    border-radius:28px;
    padding:48px 50px 40px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
    text-align:center;
}

.login-card h1{
    margin:0;
    color:#1f2937;
    font-size:36px;
}

.login-subtitle{
    margin:14px 0 35px;
    color:#64748b;
    font-size:20px;
}

#loginPassword{
    width:100%;
    height:70px;
    padding:0 20px;
    border:1px solid #cbd5e1;
    border-radius:14px;
    outline:none;
    font-size:22px;
    text-align:center;
}

#loginPassword:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

.password-wrapper{position:relative;width:100%;}
.password-wrapper #loginPassword{padding-right:60px;}
.toggle-password{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:62px;height:45px;border:0;border-radius:9px;background:transparent;color:#475569;font-size:14px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.toggle-password:hover{background:#f1f5f9;}

#loginButton{
    width:100%;
    height:70px;
    margin-top:24px;
    border:0;
    border-radius:14px;
    background:#2563eb;
    color:white;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
}

#loginButton:active{
    transform:scale(.98);
}

#loginError{
    min-height:24px;
    margin-top:14px;
    color:#dc2626;
    font-weight:bold;
}

.developer-contact{
    margin-top:20px;
    color:#64748b;
    font-size:15px;
    line-height:1.7;
}

.developer-contact strong{
    color:#1f2937;
}

#websiteContent{
    display:none;
}

/* =====================================================
   HEADER
===================================================== */

header{
    background:#1f2937;
    color:white;
    padding:30px 70px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:34px;
}

header p{
    margin:8px 0 0;
    color:#d1d5db;
    font-size:19px;
}

/* =====================================================
   MENU
===================================================== */

.menu-button{
    position:fixed;
    top:16px;
    right:16px;
    z-index:1001;
    padding:13px 18px;
    border:0;
    border-radius:12px;
    background:white;
    color:#111827;
    font-size:16px;
    font-weight:bold;
    box-shadow:0 4px 15px rgba(0,0,0,.2);
}

.drawer{
    position:fixed;
    top:0;
    right:-380px;
    width:350px;
    max-width:90%;
    height:100vh;
    background:white;
    z-index:1000;
    padding:25px 20px;
    box-shadow:-8px 0 25px rgba(0,0,0,.2);
    transition:.25s;
    overflow:auto;
}

.drawer.open{
    right:0;
}

.drawer h2{
    margin-top:0;
    color:#1f2937;
}

.menu-item{
    display:block;
    width:100%;
    padding:17px 10px;
    border:0;
    border-bottom:1px solid #e5e7eb;
    background:white;
    text-align:left;
    font-size:17px;
    color:#111827;
}

.menu-item:hover{
    background:#f3f4f6;
}

.overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:999;
}

.overlay.show{
    display:block;
}



/* =====================================================
   PESAN ADMIN / KOTAK MASUK
===================================================== */
.message-menu-item{
    position:relative;
    display:flex !important;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}
.message-menu-text{display:inline-flex;align-items:center;gap:8px;}
.message-notif-lamp{
    display:none;
    width:9px;
    height:9px;
    min-width:9px;
    border-radius:50%;
    background:#ef4444;
    box-shadow:0 0 0 3px rgba(239,68,68,.12),0 0 10px rgba(239,68,68,.95);
    animation:messageLampBlink .9s infinite alternate;
}
.message-notif-lamp.show{display:inline-block;}
@keyframes messageLampBlink{from{opacity:.35;transform:scale(.85)}to{opacity:1;transform:scale(1.2)}}
.message-count-badge{
    display:none;
    min-width:20px;
    padding:2px 6px;
    border-radius:999px;
    background:#ef4444;
    color:#fff;
    font-size:11px;
    font-weight:900;
    text-align:center;
}
.message-count-badge.show{display:inline-block;}
.admin-note-modal .modal-card{max-width:520px;}
.admin-note-info{
    margin:0 0 14px;
    padding:10px 12px;
    border-radius:10px;
    background:#f0fdf4;
    color:#166534;
    font-size:13px;
}
.admin-note-input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;outline:none;}
.admin-note-textarea{min-height:130px;resize:vertical;}
.admin-note-label{display:block;margin:10px 0 6px;font-size:13px;font-weight:800;color:#475569;}
.inbox-empty{padding:22px;text-align:center;color:#64748b;}
.inbox-list{display:flex;flex-direction:column;gap:10px;max-height:55vh;overflow:auto;}
.inbox-card{padding:13px;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;}
.inbox-card.new{border-left:4px solid #ef4444;background:#fff7f7;}
.inbox-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;font-weight:800;color:#1e293b;}
.inbox-meta{margin-top:4px;font-size:12px;color:#64748b;}
.inbox-message{margin-top:9px;white-space:pre-wrap;color:#334155;line-height:1.5;}

/* =====================================================
   CONTAINER
===================================================== */

.container{
    width:94%;
    max-width:1400px;
    margin:25px auto 50px;
}

/* =====================================================
   SEARCH
===================================================== */

.search-box{
    background:white;
    padding:18px;
    border-radius:16px;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.search-box input{
    width:100%;
    padding:16px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    font-size:18px;
    outline:none;
}

/* =====================================================
   DASHBOARD
===================================================== */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
    cursor:pointer;
    transition:.2s;
}

.stat:hover{
    transform:translateY(-2px);
    box-shadow:0 7px 20px rgba(0,0,0,.1);
}

.stat-title{
    color:#64748b;
    font-size:17px;
}

.stat-value{
    margin-top:7px;
    font-size:34px;
    font-weight:bold;
}

.stat-ok{
    border-left:5px solid #15803d;
}

.stat-low{
    border-left:5px solid #d97706;
}

.stat-empty{
    border-left:5px solid #dc2626;
}

.stat-restock{
    border-left:5px solid #7c3aed;
}

/* =====================================================
   FILTER RESULT
===================================================== */

.filter-info{
    display:none;
    background:#e0e7ff;
    color:#3730a3;
    padding:14px 18px;
    border-radius:10px;
    margin-bottom:15px;
    font-weight:bold;
}

.filter-info.show{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.clear-filter{
    border:0;
    background:#3730a3;
    color:white;
    padding:8px 12px;
    border-radius:7px;
    font-weight:bold;
}

/* =====================================================
   TABLE
===================================================== */

.table-wrap{
    background:white;
    border-radius:16px;
    overflow:auto;
    box-shadow:0 4px 15px rgba(0,0,0,.07);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1000px;
}

th{
    background:#374151;
    color:white;
    padding:15px;
    text-align:left;
}

td{
    padding:14px;
    border-bottom:1px solid #e5e7eb;
}

.status-ok{
    color:#15803d;
    font-weight:bold;
}

.status-low{
    color:#d97706;
    font-weight:bold;
}

.status-empty{
    color:#dc2626;
    font-weight:bold;
}

/* =====================================================
   BUTTON
===================================================== */

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.btn{
    border:0;
    border-radius:8px;
    padding:9px 12px;
    font-weight:bold;
    color:white;
}

.btn-in{
    background:#15803d;
}

.btn-out{
    background:#dc2626;
}

.btn-edit{
    background:#475569;
}

.btn-delete{
    background:#991b1b;
}

.btn-primary{
    background:#2563eb;
    color:white;
    border:0;
    border-radius:8px;
    padding:12px 16px;
    font-weight:bold;
}

.btn-success{
    background:#15803d;
    color:white;
    border:0;
    border-radius:8px;
    padding:12px 16px;
    font-weight:bold;
}

.btn-light{
    background:#e5e7eb;
    color:#111827;
    border:0;
    border-radius:8px;
    padding:12px 16px;
    font-weight:bold;
}

/* =====================================================
   MODAL
===================================================== */

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:1100;
    background:rgba(0,0,0,.5);
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-card{
    width:min(900px,100%);
    max-height:92vh;
    overflow:auto;
    background:white;
    border-radius:16px;
    padding:22px;
}

.modal-card.small{
    width:min(550px,100%);
}

.modal-card h2{
    margin-top:0;
    color:#1f2937;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

.form-group input,
.form-group select{
    width:100%;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:16px;
    outline:none;
}

.modal-actions{
    display:flex;
    gap:10px;
    justify-content:flex-end;
    margin-top:18px;
}

/* =====================================================
   AVAILABLE STOCK
===================================================== */

.available-stock{
    background:#eff6ff;
    border:1px solid #bfdbfe;
    color:#1e40af;
    padding:14px;
    border-radius:10px;
    margin-bottom:15px;
    font-size:17px;
    font-weight:bold;
}

.stock-number{
    font-size:26px;
}

/* =====================================================
   IMPORT
===================================================== */

.import-info{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:10px;
    padding:14px;
    margin-bottom:15px;
    line-height:1.6;
}

.excel-preview{
    overflow:auto;
    max-height:400px;
    margin-top:15px;
}

.excel-preview table{
    min-width:700px;
}

/* =====================================================
   HISTORY
===================================================== */

.history-summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:15px;
}

.history-box{
    background:#f8fafc;
    border-radius:10px;
    padding:15px;
    text-align:center;
}

.history-box strong{
    display:block;
    font-size:25px;
    margin-top:5px;
}

/* =====================================================
